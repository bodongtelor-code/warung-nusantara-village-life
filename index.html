function phone(){const cost=storageLevel===0?45000:storageLevel===1?90000:0;openModal('<h2>📱 HP NUSANTARA</h2><p>Kelola stok dan upgrade warung.</p><div class="line">📦 5 stok <b>Rp15.000</b> <button id="buy5">BELI</button></div><div class="line">📦 10 stok <b>Rp28.000</b> <button id="buy10">BELI</button></div><div class="line">🪵 Upgrade rak level '+storageLevel+'/2 <b>'+(cost?fmt(cost):'MAKSIMAL')+'</b> <button id="upgradeRack" '+(!cost?'disabled':'')+'>UPGRADE</button></div><p>💰 Saldo: '+fmt(money)+'<br>📦 Stok: '+stock+' / '+stockCapacity()+'</p><div class="line">🌙 Mulai hari berikutnya <button id="nextDay">TIDUR</button></div><hr><h3>🎯 Misi & Hadiah</h3>'+missions.map(m=>'<div class="line">'+m.name+' ('+Math.min(served,m.goal)+'/'+m.goal+') <b>'+fmt(m.reward)+'</b> <button data-claim="'+m.id+'" '+(served<m.goal||claimedMissions.includes(m.id)?'disabled':'')+'>'+(claimedMissions.includes(m.id)?'DIKLAIM':served>=m.goal?'KLAIM':'TERKUNCI')+'</button></div>').join('')+'<hr><h3>📊 Laporan Warung</h3><p>🧾 Transaksi: '+served+'<br>💵 Penjualan tercatat: '+fmt(totalSales)+'<br>📦 Belanja stok tercatat: '+fmt(totalRestock)+'<br>📈 Arus bersih sebelum upgrade: '+fmt(totalSales-totalRestock)+'</p><small>Angka ini belum memperhitungkan stok awal dan biaya upgrade; bukan laba bersih.</small>');document.getElementById('nextDay').onclick=()=>{if(order||checkoutPhase!=='idle'){toast('🛒 Selesaikan pesanan aktif dulu sebelum tidur.');return}dayNumber++;minutes=480;save();update();phone();toast('🌅 Selamat pagi! Hari '+dayNumber+' dimulai.')};for(const btn of modal.querySelectorAll('[data-claim]'))btn.onclick=()=>{const m=missions.find(v=>v.id===btn.dataset.claim);if(!m||served<m.goal||claimedMissions.includes(m.id))return;claimedMissions.push(m.id);money+=m.reward;save();update();phone();toast('🏆 Hadiah misi '+m.name+': +'+fmt(m.reward))};for(const [id,qty,price] of [['buy5',5,15000],['buy10',10,28000]])document.getElementById(id).onclick=()=>{if(stock+qty>stockCapacity()){toast('📦 Kapasitas penuh! Upgrade rak atau beli paket lebih kecil.');return}if(money<price){toast('💰 Uang belum cukup.');return}money-=price;stock+=qty;totalRestock+=price;save();update();phone();toast('📦 Stok bertambah '+qty)};document.getElementById('upgradeRack').onclick=()=>{if(!cost)return;if(money<cost){toast('💰 Uang belum cukup untuk upgrade.');return}money-=cost;storageLevel++;upgradeShelf.visible=true;save();update();phone();toast('🎉 Rak level '+storageLevel+'! Kapasitas '+stockCapacity()+' stok.')}}

const keys={};window.addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyE'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyE'&&back.style.display!=='flex')interact();if(e.code==='Escape')back.style.display='none'});window.addEventListener('keyup',e=>keys[e.code]=false);
const ray=new T.Raycaster(),mouse=new T.Vector2(),ground=new T.Plane(new T.Vector3(0,1,0),0),hit=new T.Vector3();let destination=null,drag=false,dragged=false,lastX=0,lastY=0,button=0,yaw=-.55,pitch=.52,distance=19;const target=new T.Vector3(-6,0,6);const cv=renderer.domElement;cv.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('pointerdown',e=>{if(e.target!==cv)return;drag=true;dragged=false;lastX=e.clientX;lastY=e.clientY;button=e.button;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)dragged=true;if(button===2){yaw-=dx*.007;pitch=Math.max(.25,Math.min(1.3,pitch+dy*.005))}lastX=e.clientX;lastY=e.clientY});cv.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(!dragged&&button===0){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);if(ray.ray.intersectPlane(ground,hit)&&valid(hit.x,hit.z))destination=new T.Vector3(hit.x,0,hit.z)}});cv.addEventListener('wheel',e=>{distance=Math.max(9,Math.min(38,distance+e.deltaY*.015))},{passive:true});
let joyX=0,joyY=0;const joy=document.getElementById('joystick'),nub=document.getElementById('nub');function joyUpdate(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),scale=Math.min(1,45/len);joyX=dx*scale/45;joyY=dy*scale/45;nub.style.transform=`translate(${joyX*34}px,${joyY*34}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyUpdate(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joyUpdate(e)});joy.addEventListener('pointerup',()=>{joyX=joyY=0;nub.style.transform='' });
const clock=new T.Clock();let elapsed=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.06);elapsed+=dt;minutes+=dt*.3;if(minutes>=1440){minutes-=1440;dayNumber++;save();toast('🌅 Hari '+dayNumber+' dimulai!')}const hour=minutes/60;const daylight=Math.max(.13,Math.min(1,(hour-5)/2.5,(20-hour)/2.5));ambient.intensity=.3+daylight*.88;sun.intensity=.12+daylight*1.53;renderer.toneMappingExposure=.58+daylight*.33;scene.background.setRGB(.035+daylight*.35,.065+daylight*.58,.14+daylight*.68);scene.fog.color.copy(scene.background);checkoutTick(dt);tickCustomers(dt,elapsed);tickVillageLife(dt,elapsed,hour);refreshGuide();shelfMarker.rotation.y+=dt*.45;counterMarker.rotation.y+=dt*.45;handAnim=Math.max(0,handAnim-dt*2.5);if(heldProduct){carriedItem.position.y=1.35+Math.sin(elapsed*7)*.045;player.arms[1].rotation.x=-.9-handAnim*.5}else{carriedItem.position.y=1.35}let mx=0,mz=0;if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;mx+=joyX;mz+=joyY;let moving=false;if(mx||mz){destination=null;const forward=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const v=right.multiplyScalar(mx).addScaledVector(forward,-mz).normalize();const xx=player.g.position.x+v.x*dt*4,zz=player.g.position.z+v.z*dt*4;if(valid(xx,player.g.position.z))player.g.position.x=xx;if(valid(player.g.position.x,zz))player.g.position.z=zz;player.g.rotation.y=Math.atan2(v.x,v.z);moving=true}else if(destination){const v=destination.clone().sub(player.g.position);v.y=0;if(v.length()<.18)destination=null;else{v.normalize();const xx=player.g.position.x+v.x*dt*3.6,zz=player.g.position.z+v.z*dt*3.6;if(valid(xx,zz)){player.g.position.x=xx;player.g.position.z=zz;player.g.rotation.y=Math.atan2(v.x,v.z);moving=true}else destination=null}}for(const [i,l] of player.legs.entries())l.rotation.x=moving?Math.sin(elapsed*10+i*Math.PI)*.46:0;player.g.position.y=moving?Math.abs(Math.sin(elapsed*10))*.045:0;for(const [i,a] of player.arms.entries())if(!(heldProduct&&i===1))a.rotation.x=moving?Math.sin(elapsed*10+i*Math.PI+Math.PI)*.35:0;target.lerp(new T.Vector3(player.g.position.x,1.1,player.g.position.z),.065);const off=new T.Vector3(Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.position.copy(target).add(off);camera.lookAt(target);if(Math.floor(elapsed)%2===0)update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
